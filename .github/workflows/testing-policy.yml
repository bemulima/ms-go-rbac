name: Testing Policy Canary

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      command:
        description: Testing Policy tier
        type: choice
        required: true
        default: verify:pr
        options:
          - verify:pr
          - verify:main
          - verify:nightly
          - verify:release

permissions:
  contents: read

jobs:
  testing-policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RBAC_MIGRATION_TEST_ADMIN_DSN: postgres://postgres:rbac-ci-only@127.0.0.1:5432/postgres?sslmode=disable
      RBAC_MIGRATION_TEST_ALLOW_CREATE_DATABASE: YES
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: rbac-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned golangci-lint
        shell: bash
        run: |
          set -euo pipefail
          export GOBIN="$GITHUB_WORKSPACE/.cache/bin"
          mkdir -p "$GOBIN"
          GOTOOLCHAIN=go1.24.4 go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          echo "$GOBIN" >> "$GITHUB_PATH"

      - name: Verify pinned golangci-lint
        shell: bash
        run: |
          set -euo pipefail
          expected="$GITHUB_WORKSPACE/.cache/bin/golangci-lint"
          resolved="$(command -v golangci-lint)"
          if [[ "$resolved" != "$expected" ]]; then
            echo "Expected golangci-lint at $expected; resolved $resolved" >&2
            exit 1
          fi
          version="$("$resolved" version)"
          if [[ "$version" != *"version v1.64.8 built with go1.24.4"* ]]; then
            echo "Unexpected golangci-lint version/build toolchain: $version" >&2
            exit 1
          fi
          go_version="$(go version "$resolved")"
          if [[ "$go_version" != *": go1.24.4" ]]; then
            echo "Unexpected golangci-lint binary toolchain: $go_version" >&2
            exit 1
          fi
          printf 'Pinned linter preflight PASS: %s; %s\n' "$resolved" "$version"

      - name: Set up Node 20 for Testing Policy
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.5

      - name: Set up Task
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ github.token }}

      - name: Verify frozen policy bundle identity
        run: |
          node <<'NODE'
          const { createHash } = require('node:crypto');
          const { readFileSync } = require('node:fs');
          const expected = {
            policy_source_commit: 'd31f717d9ba5222524c7e2dec69e9d3d4377e0b7',
            policy_semantics_sha: '3a374a116118d07311dab69513fdb271b82ec7a91e07d966c3515a80ff408241',
            bundle_sha256: '60e6a182728d92d9497ec1134b47b22ec1a7412ba85ffa2bf4bbeb1b5ac56818',
            node_runtime_requirement: '>=20 <21',
          };
          if (Number(process.versions.node.split('.')[0]) !== 20) {
            throw new Error(`Policy runner requires Node 20; found ${process.versions.node}`);
          }
          const lock = JSON.parse(readFileSync('.ai/testing/policy/policy-lock.json', 'utf8'));
          for (const [key, value] of Object.entries(expected)) {
            if (lock[key] !== value) throw new Error(`Policy lock identity mismatch: ${key}`);
          }
          const digest = createHash('sha256')
            .update(readFileSync('.ai/testing/policy/policy-runner.cjs'))
            .digest('hex');
          if (digest !== expected.bundle_sha256) throw new Error('Policy bundle checksum mismatch');
          console.log(`Frozen policy bundle checksum PASS sha256=${digest}`);
          NODE
          node .ai/testing/policy/policy-runner.cjs --version
          node .ai/testing/policy/policy-runner.cjs verify-lock --lock .ai/testing/policy/policy-lock.json

      - name: Validate testing manifest
        run: node .ai/testing/policy/policy-runner.cjs validate --repo .

      - name: Run selected Testing Policy tier
        id: policy_run
        continue-on-error: true
        env:
          POLICY_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          POLICY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          POLICY_HEAD_SHA: ${{ github.sha }}
          POLICY_TIER_COMMAND: ${{ github.event_name == 'schedule' && 'verify:nightly' || github.event_name == 'pull_request' && 'verify:pr' || github.event_name == 'push' && 'verify:main' || inputs.command || 'verify:pr' }}
        shell: bash
        run: |
          args=(node .ai/testing/policy/policy-runner.cjs verify --repo . --command "$POLICY_TIER_COMMAND" --output-dir . --run-id "$POLICY_RUN_ID" --head "$POLICY_HEAD_SHA")
          if [[ -n "$POLICY_BASE_SHA" && "$POLICY_BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            args+=(--base "$POLICY_BASE_SHA")
          fi
          "${args[@]}"


      - name: Validate policy result artifacts
        id: result_validation
        if: always()
        shell: bash
        run: |
          if [[ ! -d test-results ]]; then
            echo 'No test-results directory was produced.' >&2
            exit 1
          fi
          mapfile -d '' results < <(find test-results -type f -name test-result.v1.json -print0)
          if ((${#results[@]} == 0)); then
            echo 'No test-result.v1.json files were produced.' >&2
            exit 1
          fi
          for result in "${results[@]}"; do
            node .ai/testing/policy/policy-runner.cjs validate-result --repo . --result "$result"
          done

      - name: Upload policy result artifact
        id: result_upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testing-policy-results
          path: test-results/**
          if-no-files-found: error
          retention-days: ${{ inputs.command == 'verify:release' && 365 || inputs.command == 'verify:pr' && 30 || github.event_name == 'pull_request' && 30 || 90 }}

      - name: Enforce policy result after artifact upload
        if: always()
        env:
          POLICY_OUTCOME: ${{ steps.policy_run.outcome }}
          VALIDATION_OUTCOME: ${{ steps.result_validation.outcome }}
          UPLOAD_OUTCOME: ${{ steps.result_upload.outcome }}
        shell: bash
        run: |
          set -u
          status=0
          if [[ "$VALIDATION_OUTCOME" != success ]]; then
            echo "Result validation did not succeed: $VALIDATION_OUTCOME" >&2
            status=1
          fi
          if [[ "$UPLOAD_OUTCOME" != success ]]; then
            echo "Required result artifact upload did not succeed: $UPLOAD_OUTCOME" >&2
            status=1
          fi
          if [[ ! -d test-results ]]; then
            echo 'No test-results directory is available for final enforcement.' >&2
            exit 1
          fi
          mapfile -d '' results < <(find test-results -type f -name test-result.v1.json -print0)
          if ((${#results[@]} == 0)); then
            echo 'No test-result.v1.json files are available for final enforcement.' >&2
            exit 1
          fi
          for result in "${results[@]}"; do
            node .ai/testing/policy/policy-runner.cjs enforce-result --repo . --result "$result"
            result_status=$?
            if [[ "$result_status" -ne 0 && "$status" -eq 0 ]]; then
              status="$result_status"
            fi
          done
          if [[ "$POLICY_OUTCOME" != success && "$status" -eq 0 ]]; then
            echo "Policy runner command did not pass: $POLICY_OUTCOME" >&2
            status=1
          fi
          exit "$status"
