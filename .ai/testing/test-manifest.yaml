    implementation: MISSING
    commands: []
    reason: "Cross-service browser acceptance is owned by the Verification Platform."
  platform.contract_compatibility:
    applicability: NOT_APPLICABLE
    implementation: MISSING
    commands: []
    reason: "Cross-repository provider-consumer compatibility orchestration is owned by the Verification Platform."
  platform.architecture:
    applicability: NOT_APPLICABLE
    implementation: MISSING
    commands: []
