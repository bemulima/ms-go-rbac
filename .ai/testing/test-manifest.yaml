  platform.reporting:
    applicability: NOT_APPLICABLE
    implementation: MISSING
    commands: []
    reason: "Cross-repository result normalization and aggregation are owned by the Verification Platform."

commands:
  "test:unit":
    availability: AVAILABLE
    invoke: ["task", "test"]
    working_directory: .
    timeout_seconds: 2400
    env: ["RBAC_MIGRATION_TEST_ADMIN_DSN", "RBAC_MIGRATION_TEST_ALLOW_CREATE_DATABASE"]
    requires:
      - type: "database"
        mode: "managed"
        probe: "tcp"
        endpoint_env: "RBAC_MIGRATION_TEST_ADMIN_DSN"
  "test:transport":
    availability: AVAILABLE
    invoke: ["go", "run", "./cmd/ms-rbac-http-integration"]
    working_directory: .
    timeout_seconds: 1800
    env: ["RBAC_MIGRATION_TEST_ADMIN_DSN", "RBAC_MIGRATION_TEST_ALLOW_CREATE_DATABASE"]
    requires:
      - type: "database"
        mode: "managed"
        probe: "tcp"
        endpoint_env: "RBAC_MIGRATION_TEST_ADMIN_DSN"
  "test:integration:deps":
    availability: AVAILABLE
    invoke: ["go", "run", "./cmd/ms-rbac-http-integration"]
    working_directory: .
    timeout_seconds: 1800
    env: ["RBAC_MIGRATION_TEST_ADMIN_DSN", "RBAC_MIGRATION_TEST_ALLOW_CREATE_DATABASE"]
    requires:
      - type: "database"
        mode: "managed"
        probe: "tcp"
        endpoint_env: "RBAC_MIGRATION_TEST_ADMIN_DSN"
  "test:migration":
    availability: AVAILABLE
    invoke: ["go", "test", "./cmd/ms-rbac-migrate", "-count=1"]
    working_directory: .
    timeout_seconds: 1800
    env: ["RBAC_MIGRATION_TEST_ADMIN_DSN", "RBAC_MIGRATION_TEST_ALLOW_CREATE_DATABASE"]
    requires:
      - type: "database"
        mode: "managed"
        probe: "tcp"
        endpoint_env: "RBAC_MIGRATION_TEST_ADMIN_DSN"
  "test:architecture":
    availability: AVAILABLE
    invoke: ["task", "test"]
    working_directory: .
    timeout_seconds: 2400
    env: ["RBAC_MIGRATION_TEST_ADMIN_DSN", "RBAC_MIGRATION_TEST_ALLOW_CREATE_DATABASE"]
    requires:
      - type: "database"
        mode: "managed"
        probe: "tcp"
        endpoint_env: "RBAC_MIGRATION_TEST_ADMIN_DSN"
  "check:types":
    availability: AVAILABLE
    invoke: ["go", "vet", "./..."]
    working_directory: .
    timeout_seconds: 1200
  "check:lint":
    availability: AVAILABLE
    invoke: ["golangci-lint", "run", "./..."]
    working_directory: .
    timeout_seconds: 1800
  "check:format":
    availability: UNAVAILABLE
    reason: "The owner CI format check is expressed with shell command substitution; the frozen runner accepts argv only and no checked-in shell-free formatter adapter exists."
  "coverage":
    availability: UNAVAILABLE
    reason: "No native coverage command, configured threshold, or coverage artifact is declared at the audited HEAD."
  "test:persistence":
    availability: UNAVAILABLE
    reason: "No dedicated policy-runnable test:persistence command is registered at the audited committed HEAD."
  "test:events":
    availability: UNAVAILABLE
    reason: "No dedicated policy-runnable test:events command is registered at the audited committed HEAD."
  "test:contract":
    availability: UNAVAILABLE
    reason: "No dedicated policy-runnable test:contract command is registered at the audited committed HEAD."

