    applicability: APPLICABLE
    implementation: MISSING
    commands: [test:contract]
    exception_id: MS_GO_RBAC_CONTRACT_PROVIDER
  contract.consumer:
    applicability: APPLICABLE
    implementation: MISSING
    commands: [test:contract]
    exception_id: MS_GO_RBAC_CONTRACT_CONSUMER
  architecture.local:
    applicability: APPLICABLE
    implementation: PARTIAL
    commands: [test:architecture]
    exception_id: MS_GO_RBAC_ARCHITECTURE_LOCAL
  quality.static:
    applicability: APPLICABLE
    implementation: PARTIAL
    commands: [check:format, check:lint, check:types]
    exception_id: MS_GO_RBAC_QUALITY_STATIC
  coverage:
    applicability: APPLICABLE
    implementation: MISSING
    commands: [coverage]
    exception_id: MS_GO_RBAC_COVERAGE
  mutation:
    applicability: NOT_APPLICABLE
    implementation: MISSING
    commands: []
    reason: "Mutation testing is outside the frozen GO_SERVICE profile and is reserved for later capability work."
  frontend.hook:
    applicability: NOT_APPLICABLE
    implementation: MISSING
    commands: []
    reason: "A Go backend service does not own frontend hooks."
  frontend.store:
    applicability: NOT_APPLICABLE
    implementation: MISSING
    commands: []
    reason: "A Go backend service does not own frontend state stores."
