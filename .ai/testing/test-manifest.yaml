schema_version: test-manifest.v1
manifest_version: "1.0.0"
policy_version: testing-policy.v1

repository:
  id: ms-go-rbac
  profile: GO_SERVICE
  stack:
    language: Go
    runtime:
      name: go
      version: "1.22"

suites:
  unit.domain:
    applicability: APPLICABLE
    implementation: PARTIAL
    commands: [test:unit]
    exception_id: MS_GO_RBAC_UNIT_DOMAIN
  application.usecase:
    applicability: APPLICABLE
    implementation: PARTIAL
    commands: [test:unit]
    exception_id: MS_GO_RBAC_APPLICATION_USECASE
  persistence.repository:
    applicability: APPLICABLE
    implementation: MISSING
    commands: [test:persistence]
    exception_id: MS_GO_RBAC_PERSISTENCE_REPOSITORY
  transport.http:
    applicability: APPLICABLE
    implementation: PARTIAL
    commands: [test:transport]
    exception_id: MS_GO_RBAC_TRANSPORT_HTTP
  authorization:
    applicability: APPLICABLE
    implementation: PARTIAL
    commands: [test:unit]
    exception_id: MS_GO_RBAC_AUTHORIZATION
  integration.hermetic:
    applicability: APPLICABLE
    implementation: PARTIAL
    commands: [test:unit]
    exception_id: MS_GO_RBAC_INTEGRATION_HERMETIC
  integration.dependency:
    applicability: APPLICABLE
    implementation: PARTIAL
    commands: [test:integration:deps]
    exception_id: MS_GO_RBAC_INTEGRATION_DEPENDENCY
  migration.lifecycle:
    applicability: APPLICABLE
    implementation: PARTIAL
    commands: [test:migration]
    exception_id: MS_GO_RBAC_MIGRATION_LIFECYCLE
  event.producer:
    applicability: APPLICABLE
    implementation: MISSING
    commands: [test:events]
    exception_id: MS_GO_RBAC_EVENT_PRODUCER
  event.consumer:
    applicability: APPLICABLE
    implementation: MISSING
    commands: [test:events]
    exception_id: MS_GO_RBAC_EVENT_CONSUMER
