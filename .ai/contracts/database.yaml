schema_version: 1
documentation: docs/database-contract.md
owner: ms-go-rbac
tables: [service, role, role_hierarchy, permission, role_permission, service_role, service_permission, principal_role, principal_override, superadmin_principal, signup_provisioning_receipt, rbac_schema_migrations, operator_bootstrap_receipt, cat49_disposable_reviewer_grant, mentor_role_scope, mentor_role_command_receipt, mentor_role_fence, mcp_mentor_profile_permission, mcp_mentor_offers_permission, mcp_mentor_workspace_read_permission, mcp_mentor_skill_draft_permission, mcp_mentor_authoring_permission, mcp_mentor_skill_final_review_permission, mcp_mentor_management_permission]
migrations: [001_init, 002_seed_default_roles_and_principals, 003_signup_provisioning_receipts, 004_operator_bootstrap_receipts, 005_cat49_disposable_reviewer_grant, 005_mentor_role_owner, 006_mcp_mentor_profile_permission, 007_mcp_mentor_offers_permission, 008_mcp_mentor_workspace_read_permissions, 009_mcp_mentor_skill_draft_permission, 010_mcp_mentor_authoring_permissions, 011_mcp_mentor_skill_final_permission, 012_mcp_mentor_management_permissions, 013_mcp_mentor_authored_content_read, 014_mcp_mentor_cohort_response_permission, 015_mcp_mentor_student_feedback_permission]
migration_ledger_identity: full_forward_sql_filename
mcp_disposable_profile:
  status_command: status-mcp
  up_command: up-mcp
  forward_sql: [001_init.sql, 003_signup_provisioning_receipts.up.sql, 004_operator_bootstrap_receipts.up.sql]
  excluded_disposition: 002_seed_default_roles_and_principals.up.sql
  approval_required: true
  grants_seeded: false
mentor_owner: {contract: RBAC_MENTOR_ROLE_OWNER_V1, documentation: docs/mentor-role-owner.md, status: source_only_unmounted_sql_not_run}

mcp_mentor_profile_permission:
  migration: 006_mcp_mentor_profile_permission
  action: mcp.mentor.profile.read
  grants_seeded: false
  readback: same_repeatable_read_snapshot_as_exact_scoped_role
  rollback: refuses_retained_assignments
  sql_acceptance: NOT_RUN


mcp_mentor_offers_permission:
  migration: 007_mcp_mentor_offers_permission
  action: mcp.mentor.offers.read
  grants_seeded: false
  readback: same_repeatable_read_snapshot_as_exact_scoped_role
  rollback: refuses_retained_assignments
  sql_acceptance: NOT_RUN

mcp_mentor_workspace_read_permission:
  migration: 008_mcp_mentor_workspace_read_permissions
  mapping: mcp-mentor-access-v1.json
  grants_seeded: false
  readback: exact_scope_and_action_in_same_repeatable_read_snapshot_as_scoped_role
  rollback: refuses_retained_assignments
  sql_acceptance: NOT_RUN

mcp_mentor_skill_draft_permission:
  migration: 009_mcp_mentor_skill_draft_permission
  action: mcp.mentor.skills.write
  grants_seeded: false
  readback: same_repeatable_read_snapshot_as_exact_scoped_role
  rollback: refuses_retained_assignments
  sql_acceptance: NOT_RUN

mcp_mentor_management_permission:
  migration: 012_mcp_mentor_management_permissions
  exact_scope_action_marker: true
  default_grants: false

mcp_mentor_cohort_response_permission:
  migration: 014_mcp_mentor_cohort_response_permission
  default_grants: false

mcp_mentor_student_feedback_permission:
