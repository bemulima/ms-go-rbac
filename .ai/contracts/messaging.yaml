schema_version: 1
documentation: docs/messaging-contract.md
core_nats_rpc:
  consumes:
    - {subject: rbac.assign-role, queue: ms-go-rbac, request: [key_id, payload, signature], response: [ok, error]}
    - {subject: rbac.checkRole, queue: ms-go-rbac, request: [user_id, role], response: [ok, error]}
    - {subject: rbac.checkPermission, queue: ms-go-rbac, request: [proof], response: [decision_jwt, error]}
reviewer_permission_lookup:
  super_admin: {canonical_default_role: admin, individual_permission_grant_required: false, caller_role_claims: forbidden}
  request_fields: [proof]
  jwt_header: {alg: RS256, typ: JWT}
  jwt_claims: [iss, aud, sub, typ, purpose, permission, jti, iat, exp]
  audience: ms-go-rbac-knowledge-review
  purpose: AUTH_RBAC_KNOWLEDGE_GRAPH_REVIEW_PERMISSION_V1
  proof_type: knowledge_graph_permission_check
  permission: knowledge_graph.review
  signing_algorithm: RS256
  public_key_config: AUTH_JWT_PUBLIC_KEY
  issuer: {config: AUTH_JWT_ISSUER, default: auth-service}
  subject_and_jti: canonical_nonzero_uuid
  maximum_lifetime_seconds: 30
  future_iat_skew_seconds: 5
  request_identity_fields: forbidden
  signed_decision:
    envelope: [decision_jwt]
    algorithm: RS256
    header: {alg: RS256, typ: JWT}
    claims: [iss, aud, sub, typ, purpose, permission, decision, jti, request_jti, request_digest, iat, exp]
    issuer: ms-go-rbac
    audience: ms-go-auth-knowledge-review-permission-decision
    type: knowledge_graph_permission_decision
    purpose: RBAC_AUTH_KNOWLEDGE_GRAPH_REVIEW_DECISION_V1
    permission: knowledge_graph.review
    decision_values: [ALLOW, DENY]
    response_jti: fresh_nonzero_canonical_uuid
    request_binding: [verified_proof_jti, lowercase_sha256_of_exact_proof]
    private_key_config: RBAC_REVIEWER_PERMISSION_DECISION_PRIVATE_KEY
    lifetime_seconds: 15
    maximum_lifetime_seconds: 30
    no_signer: fail_closed
mcp_student_role_candidate:
  status: dormant_source_only_not_subscribed
  epic: https://github.com/bemulima/learning-platform-business/issues/53
  rpc_subject: rbac.checkMCPStudentRole
  queue: ms-go-rbac
  request_fields: [proof]
  proof:
    algorithm: RS256
    header: {alg: RS256, typ: JWT}
    claims: [iss, aud, sub, typ, purpose, role, jti, iat, exp]
    audience: ms-go-rbac-mcp-student-role
    type: mcp_student_role_check
    purpose: AUTH_RBAC_MCP_STUDENT_ROLE_V1
    role: student
    maximum_lifetime_seconds: 30
    future_iat_skew_seconds: 5
    subject_and_jti: canonical_lowercase_nonzero_uuid
    auth_public_key_config: AUTH_JWT_PUBLIC_KEY
    auth_issuer_config: AUTH_JWT_ISSUER
    unsigned_or_raw_student_id: denied
  role_lookup: unique_current_canonical_default_user_global_role_only
  decision:
    envelope: [decision_jwt]
    algorithm: RS256
    header: {alg: RS256, typ: JWT}
    claims: [iss, aud, sub, typ, purpose, role, decision, jti, request_jti, request_digest, iat, exp]
    issuer: ms-go-rbac
    audience: ms-go-auth-mcp-student-role-decision
    type: mcp_student_role_decision
    purpose: RBAC_AUTH_MCP_STUDENT_ROLE_DECISION_V1
    fixed_role: student
    decisions: [ALLOW, DENY]
    ttl_seconds: 15
    binding: [verified_request_jti, sha256_of_exact_raw_proof]
    future_dedicated_private_key: required_not_configured
    auth_public_key_verifier: not_implemented
  mcp_scope_grant: none_role_only
  bootstrap_subscription: forbidden_until_auth_consumer_accepted
mcp_student_read_scope_policy_candidate:
  epic: https://github.com/bemulima/learning-platform-business/issues/53
  status: dormant_source_only_not_externally_callable
  documentation: docs/mcp00-student-read-scope-policy.md
  prerequisite: unique_current_canonical_default_student_role
  request: canonical_lowercase_nonzero_principal_uuid_and_sorted_unique_pilot_scopes
  scope_limit: 3
  explicit_default_role_permissions:
    - {scope: "profile:read", role: student, action: mcp.profile.read, resource_kind: empty, resource_id: canonical_zero}
    - {scope: "courses:read", role: student, action: mcp.courses.read, resource_kind: empty, resource_id: canonical_zero}
    - {scope: "tasks:read", role: student, action: mcp.tasks.read, resource_kind: empty, resource_id: canonical_zero}
  grants_seeded: false
  unknown_or_write_scopes: denied
  admin_bypass: forbidden
  missing_permission: denied
  missing_or_ambiguous_role: denied
  dependency_failure: no_partial_scopes
  signed_scope_decision: dormant_producer_candidate_only
  auth_consent_client_platform_intersection: not_implemented
  domain_object_acl: required_at_domain_owner_not_implemented_here
  bootstrap_subscription: forbidden
mcp_student_scope_decision_candidate:
  status: dormant_source_only_not_subscribed
  epic: https://github.com/bemulima/learning-platform-business/issues/53
  documentation: docs/mcp00-student-scope-decision-source.md
  rpc_subject: rbac.checkMCPStudentScopes
  queue: ms-go-rbac
  request_fields: [proof]
  proof:
    header: {alg: RS256, typ: JWT}
    claims: [iss, aud, sub, typ, purpose, scopes, jti, iat, exp]
    audience: ms-go-rbac-mcp-student-scopes
    type: mcp_student_scope_check
    purpose: AUTH_RBAC_MCP_STUDENT_SCOPES_V1
    identity: canonical_lowercase_nonzero_uuid
    scopes: strictly_sorted_unique_pilot_read_only_1_to_3
    maximum_lifetime_seconds: 30
    future_iat_skew_seconds: 5
    auth_public_key_config: AUTH_JWT_PUBLIC_KEY
    raw_identity_and_scopes_in_rpc: denied
  decision:
    envelope: [decision_jwt]
    algorithm: RS256
    header: {alg: RS256, typ: JWT}
    claims: [iss, aud, sub, typ, purpose, requested_scopes, allowed_scopes, jti, request_jti, request_digest, iat, exp]
    issuer: ms-go-rbac
    audience: ms-go-auth-mcp-student-scopes-decision
    type: mcp_student_scopes_decision
    purpose: RBAC_AUTH_MCP_STUDENT_SCOPES_DECISION_V1
    requested: exact_verified_proof_scopes
    allowed: exact_current_default_student_role_permission_subset_or_empty
    response_jti: fresh_canonical_lowercase_nonzero_uuid
    request_binding: [verified_request_jti, sha256_exact_raw_auth_proof]
    ttl_seconds: 15
    future_dedicated_private_key: required_not_configured
    auth_public_key_verifier: not_implemented
  unknown_or_write_scopes: denied
  missing_permission: signed_empty_or_partial_subset
  ambiguous_role_or_store_failure: generic_error_no_signed_decision
  grants_seeded: false
  auth_client_consent_platform_policy: not_implemented
  domain_owner_acl: required_separately
  bootstrap_subscription: forbidden
signup_assignment:
  contract: AUTH_RBAC_STUDENT_PROVISIONING_V1
  contract_documentation: .ai/contracts/auth-rbac-student-provisioning-v1.md
  accepted_actor: dedicated ms-go-auth Ed25519 signer
  key_id: auth-signup-v1
  public_key_config: AUTH_SIGNUP_PUBLIC_KEY
  purpose: signup-student-provisioning-v1
  role: student
  scope: canonical user/global/core default tuple
  envelope: strict single JSON object; payload and signature standard base64
  maximum_bytes: {envelope: 16384, payload: 8192}
  lifetime_seconds: 60
  issued_at_future_skew_seconds: 5
  replay: verify fresh proof before immutable receipt lookup; no writes on exact replay
  unsigned_or_caller_header_fallback: forbidden
  conflict: no principal, operation, role or scope reparenting; no different default role replacement
  incompatible_signed_role_or_scope: conflict before storage; includes non-student initial operation
