schema_version: 1
commands:
  - {name: mentor-owner-runtime-tests, run: "go test ./internal/config ./cmd/ms-rbac-service -run '^TestMentorOwner(Config|Runtime)' -count=1", requires_approval: false, risk: source-only-injected-broker-no-listener-or-database}
  - {name: mentor-owner-runtime-race, run: "go test -race ./internal/config ./cmd/ms-rbac-service -run '^TestMentorOwner(Config|Runtime)' -count=1", requires_approval: false, risk: source-only-injected-broker-no-listener-or-database}
  - {name: mentor-owner-runtime-vet, run: "go vet ./internal/config ./cmd/ms-rbac-service", requires_approval: false, risk: targeted-source-analysis}
  - {name: mentor-owner-runtime-build, run: "go build -buildvcs=false -o /dev/null ./cmd/ms-rbac-service", requires_approval: false, risk: source-build-only}
  - {name: mentor-owner-composition-tests, run: "go test ./cmd/ms-rbac-service -run '^TestMentorOwnerComposition' -count=1", requires_approval: false, risk: source-only-composition-no-listener-broker-or-database}
  - {name: mentor-owner-composition-race, run: "go test -race ./cmd/ms-rbac-service -run '^TestMentorOwnerComposition' -count=1", requires_approval: false, risk: source-only-composition-no-listener-broker-or-database}
  - {name: mentor-role-mutation-rpc-tests, run: "go test ./internal/transport/message/nats ./internal/usecase -run '^TestMentorRoleMutationRPC' -count=1", requires_approval: false, risk: source-only-crypto-fixtures-no-database}
  - {name: mentor-role-mutation-rpc-race, run: "go test -race ./internal/transport/message/nats ./internal/usecase -run '^TestMentorRoleMutationRPC' -count=1", requires_approval: false, risk: source-only-crypto-fixtures-no-database}
  - {name: mentor-role-readback-tests, run: "go test ./internal/domain ./internal/usecase ./internal/infrastructure/persistence/postgres ./internal/infrastructure/client ./internal/transport/message/nats -run '^TestMentorRoleReadback' -count=1", requires_approval: false, risk: source-only-fixtures-no-database}
  - {name: mentor-role-readback-race, run: "go test -race ./internal/domain ./internal/usecase ./internal/infrastructure/persistence/postgres ./internal/infrastructure/client ./internal/transport/message/nats -run '^TestMentorRoleReadback' -count=1", requires_approval: false, risk: source-only-fixtures-no-database}
  - {name: mentor-role-owner-tests, run: "go test ./internal/domain ./internal/usecase ./internal/infrastructure/persistence/postgres ./cmd/ms-rbac-migrate -run '^TestMentorRole' -count=1", requires_approval: false, risk: source-only-fixtures-no-database}
  - {name: mentor-role-owner-race, run: "go test -race ./internal/domain ./internal/usecase ./internal/infrastructure/persistence/postgres -run '^TestMentorRole' -count=1", requires_approval: false, risk: source-only-fixtures-no-database}
  - {name: source-build-without-vcs, run: go build -buildvcs=false ./..., requires_approval: false, risk: source-build-only}
  - {name: operator-sql-acceptance, run: "go test -tags=integration ./internal/infrastructure/persistence/postgres ./cmd/ms-rbac-operator-bootstrap -run 'TestOperatorBootstrapSQL(ConcurrentReceiptAndDrift|AtomicityAndDenials)|TestOperatorCLILiveIsolatedDatabaseGuards' -count=1 -v", requires_approval: true, risk: isolated-owned-test-database-write}
  - {name: operator-sql-source-check, run: "env -u RBAC_SIGNUP_TEST_DATABASE_URL go test -tags=integration ./internal/infrastructure/persistence/postgres -run '^TestOperatorBootstrapSQLConcurrentReceiptAndDrift$' -v", requires_approval: false, risk: compile-and-skip-no-database}
  - {name: operator-bootstrap-tests, run: go test ./cmd/ms-rbac-operator-bootstrap ./internal/transport/http ./internal/infrastructure/persistence/postgres, requires_approval: false, risk: isolated-test-harness}
  - {name: agent-policy, run: ./scripts/check-agent-policy.sh, requires_approval: false, risk: verification}
  - {name: format-check, run: 'test -z "$(gofmt -l $(git ls-files ''*.go''))"', requires_approval: false, risk: verification}
  - {name: vet, run: go vet ./..., requires_approval: false, risk: verification}
  - {name: test, run: go test ./..., requires_approval: false, risk: verification}
  - {name: test-http-integration, run: go run ./cmd/ms-rbac-http-integration, requires_approval: true, risk: disposable-database-write}
  - {name: signup-contract-regression, run: 'go test ./internal/infrastructure/persistence/postgres -run "TestAuthRBACStudentProvisioningV1Contract|TestSignupProvisioningSQL"', requires_approval: false, risk: disposable-integration-test}
  - {name: run, run: go run ./cmd/ms-rbac-service, requires_approval: true, risk: lifecycle}
  - {name: migrate-up, run: task migrate-up, requires_approval: true, risk: database-write}
  - {name: migrate-up-with-legacy-fixtures, run: task migrate-up-with-legacy-fixtures, requires_approval: true, risk: database-write}
  - {name: migrate-down, run: task migrate-down, requires_approval: true, risk: destructive-database-write}
  - {name: migrate-status, run: task migrate-status, requires_approval: true, risk: database-read}
  - {name: migrate-status-legacy, run: task migrate-status-legacy, requires_approval: true, risk: database-read}
  - {name: migrate-native, run: 'task migrate:native', requires_approval: true, risk: database-write}
  - {name: migrate-native-legacy-fixtures, run: task migrate-native-legacy-fixtures, requires_approval: true, risk: database-write}
  - {name: run-native, run: 'task run:native', requires_approval: true, risk: lifecycle}
