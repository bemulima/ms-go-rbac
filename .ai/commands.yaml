schema_version: 1
commands:
  - {name: agent-policy, run: ./scripts/check-agent-policy.sh, requires_approval: false, risk: verification}
  - {name: format-check, run: 'test -z "$(gofmt -l $(git ls-files ''*.go''))"', requires_approval: false, risk: verification}
  - {name: vet, run: go vet ./..., requires_approval: false, risk: verification}
  - {name: test, run: go test ./..., requires_approval: false, risk: verification}
  - {name: test-http-integration, run: go run ./cmd/ms-rbac-http-integration, requires_approval: true, risk: disposable-database-write}
  - {name: run, run: go run ./cmd/ms-rbac-service, requires_approval: true, risk: lifecycle}
  - {name: migrate-up, run: task migrate-up, requires_approval: true, risk: database-write}
  - {name: migrate-up-with-legacy-fixtures, run: task migrate-up-with-legacy-fixtures, requires_approval: true, risk: database-write}
  - {name: migrate-down, run: task migrate-down, requires_approval: true, risk: destructive-database-write}
  - {name: migrate-status, run: task migrate-status, requires_approval: true, risk: database-read}
  - {name: migrate-status-legacy, run: task migrate-status-legacy, requires_approval: true, risk: database-read}
  - {name: migrate-native, run: 'task migrate:native', requires_approval: true, risk: database-write}
  - {name: migrate-native-legacy-fixtures, run: task migrate-native-legacy-fixtures, requires_approval: true, risk: database-write}
  - {name: run-native, run: 'task run:native', requires_approval: true, risk: lifecycle}
