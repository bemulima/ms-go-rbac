schema_version: 1
layers:
  domain: internal/domain
  usecase: internal/usecase
  adapters: internal/adapters
  composition_root: internal/app
active_paths: [HTTP CRUD and principal lookups, rbac.assign-role RPC, rbac.checkRole RPC]
inactive_or_incomplete:
  - PDP engine is not wired into bootstrap.
  - PDP repository does not implement the current domain interface because context parameters differ.
known_security_defects:
  - HTTP API and admin routes have no authentication or authorization middleware.
  - Three create handlers require nonstandard SET instead of POST.
