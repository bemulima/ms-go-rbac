version: '3'

dotenv: ['.env']

vars:
  DB_CONTAINER: postgres
  DB_USER: '{{.DB_USER | default "rbac"}}'
  DB_PASSWORD: '{{.DB_PASSWORD | default "rbac_password"}}'
  DB_NAME: '{{.DB_NAME | default "rbacdb"}}'

tasks:
  up:
    desc: Start containers
    cmds:
      - docker compose up -d

  down:
    desc: Stop containers
    cmds:
      - docker compose down

  migrate-up:
    desc: Apply schema and canonical reference data without legacy principal fixtures
    cmds:
      - docker compose --profile migration run --rm migrate up

  migrate-up-with-legacy-fixtures:
    desc: Apply all migrations, including the historical fixed principal assignments
    cmds:
      - docker compose --profile migration run --rm migrate up-with-legacy-fixtures

  migrate-down:
    desc: Rollback all migrations in reverse order
    cmds:
      - docker compose --profile migration run --rm migrate down

  migrate-status:
    desc: Show schema-profile migration status
    cmds:
      - docker compose --profile migration run --rm migrate status

  migrate-status-legacy:
    desc: Show full legacy migration status
    cmds:
      - docker compose --profile migration run --rm migrate status-legacy

  migrate:native:
    desc: Apply schema and canonical reference data to shared native PostgreSQL
    cmds:
      - python3 scripts/native_config.py -- go run ./cmd/ms-rbac-migrate up

  migrate-native-legacy-fixtures:
    desc: Apply the historical fixed-principal seed to shared native PostgreSQL
    cmds:
      - python3 scripts/native_config.py -- go run ./cmd/ms-rbac-migrate up-with-legacy-fixtures

  run:
    desc: Run service locally
    cmds:
      - go run ./cmd/ms-rbac-service

  run:native:
    desc: Run RBAC on macOS against shared PostgreSQL and NATS
    cmds:
      - python3 scripts/native_config.py -- go run ./cmd/ms-rbac-service

  test:
    desc: Run tests
    cmds:
      - go test ./...

  lint:
    desc: Run linter
    cmds:
      - golangci-lint run ./...
